[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "zealmod"
version = "0.9.0"
description = "ZealMod: своя прошивка для таймера Zeal — сборка, темы, программы"
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["esptool>=4.0", "pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pillow>=9"]          # нужна только тем, кто собирает свои .zm и темы

[project.scripts]
zealmod = "zealmod.cli:main"

[tool.setuptools]
packages = ["zealmod", "zealmod.studio"]

[tool.setuptools.package-data]
zealmod = ["profiles/*.json", "studio/web/*"]
